name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "VERSION"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild standalone v0.99.2 game for Pages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import hashlib
          import shutil

          parts = sorted(Path('site/v0992').glob('part*.txt'))
          if len(parts) != 21:
              raise SystemExit(f'Expected 21 v0.99.2 payload segments, found {len(parts)}')

          packed = ''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          compressed = base64.b64decode(packed, validate=True)
          html = gzip.decompress(compressed)
          digest = hashlib.sha256(html).hexdigest()

          if b'<!doctype html>' not in html[:200].lower():
              raise SystemExit('Decoded game does not look like HTML')
          if len(html) != 387083:
              raise SystemExit(f'Unexpected v0.99.2 standalone HTML size: {len(html)}')
          if digest != '35e369fe7f21ad69b5c13fadd50d469158ccef3b2ebcf71ab3e7fce76b8e6ba9':
              raise SystemExit(f'v0.99.2 SHA mismatch: {digest}')

          out = Path('_site')
          if out.exists():
              shutil.rmtree(out)
          out.mkdir()
          (out / 'index.html').write_bytes(html)

          for name in ('manifest.webmanifest', 'service-worker.js'):
              shutil.copy2(name, out / name)
          shutil.copytree('assets', out / 'assets')

          print('Pages build: 387083 bytes; sha256=' + digest)
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
