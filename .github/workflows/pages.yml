name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild standalone game for Pages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import hashlib
          import shutil

          repair_parts = sorted(Path('site/fix00').glob('part*.txt'))
          if len(repair_parts) != 4:
              raise SystemExit(f'Expected 4 repaired part00 segments, found {len(repair_parts)}')

          part0 = ''.join(p.read_text(encoding='utf-8').strip() for p in repair_parts)
          if len(part0) != 20000:
              raise SystemExit(f'Repaired part00 length mismatch: {len(part0)}')

          part1 = Path('site/chunks/part01.txt').read_text(encoding='utf-8').strip()
          part2 = Path('site/chunks/part02.txt').read_text(encoding='utf-8').strip()
          packed = part0 + part1 + part2

          compressed = base64.b64decode(packed, validate=True)
          html = gzip.decompress(compressed)
          if b'<!doctype html>' not in html[:200].lower():
              raise SystemExit('Decoded game does not look like HTML')
          if len(html) != 121384:
              raise SystemExit(f'Unexpected standalone HTML size: {len(html)}')

          out = Path('_site')
          if out.exists():
              shutil.rmtree(out)
          out.mkdir()
          (out / 'index.html').write_bytes(html)

          for name in ('manifest.webmanifest', 'service-worker.js'):
              shutil.copy2(name, out / name)
          shutil.copytree('assets', out / 'assets')

          print('Pages build: 121384 bytes; sha256=' + hashlib.sha256(html).hexdigest())
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
