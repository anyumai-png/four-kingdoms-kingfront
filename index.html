<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101722">
<title>Four Kingdoms — Kingfront V0.96.0</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#101722;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center}.load{max-width:520px;padding:24px;text-align:center}.spin{width:34px;height:34px;margin:0 auto 16px;border:4px solid rgba(255,255,255,.18);border-top-color:#8fcfff;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}small{opacity:.7}
</style>
</head>
<body><div class="load"><div class="spin"></div><b>Four Kingdoms — Kingfront V0.96.0</b><br><small id="msg">載入戰場中…</small></div>
<script>
(async()=>{const msg=document.getElementById('msg');try{if(typeof DecompressionStream==='undefined')throw new Error('此瀏覽器未支援必要的解壓功能');let b64='';for(const f of ['site/chunks/part00.txt','site/chunks/part01.txt','site/chunks/part02.txt']){const r=await fetch(f+'?v=0960',{cache:'no-store'});if(!r.ok)throw new Error('載入 '+f+' 失敗');b64+=(await r.text()).trim()}const bin=atob(b64),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){console.error(e);msg.textContent='載入失敗：'+e.message}})();
</script></body></html>
